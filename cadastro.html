<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONG - Cadastro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="menu">
    <h1>Cadastro de Voluntários</h1>
    <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-principal">&#9776;</button>
    <nav class="nav-links" id="menu-principal" aria-label="Navegação principal">
      <a href="index.html">Início</a>
      <div class="menu-item">
        <a href="projetos.html">Projetos</a>
        <ul class="submenu">
          <li><a href="projetos.html#campanhas">Campanhas de doação</a></li>
          <li><a href="projetos.html#voluntariado">Voluntariado</a></li>
        </ul>
      </div>
      <a href="cadastro.html">Cadastro</a>
    </nav>
  </header>

  <main class="container">
    <div class="col-12">
      <form action="#" method="post">
        <fieldset>
          <legend>Dados pessoais</legend>
          <label for="nome">Nome completo:</label>
          <input type="text" id="nome" name="nome" required>

          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" required>

          <label for="nascimento">Data de nascimento:</label>
          <input type="date" id="nascimento" name="nascimento" required>

          <label for="cpf">CPF:</label>
          <input type="text" id="cpf" name="cpf" pattern="[0-9]{11}" inputmode="numeric" title="Digite o CPF com 11 números" required>
        </fieldset>

        <fieldset>
          <legend>Endereço</legend>
          <label for="endereco">Endereço:</label>
          <input type="text" id="endereco" name="endereco" required>

          <label for="cidade">Cidade:</label>
          <input type="text" id="cidade" name="cidade" required>

          <label for="estado">Estado:</label>
          <input type="text" id="estado" name="estado" required>

          <label for="cep">CEP:</label>
          <input type="text" id="cep" name="cep" pattern="[0-9]{5}-[0-9]{3}" inputmode="numeric" title="Digite o CEP no formato 00000-000" required>
        </fieldset>

        <fieldset>
          <legend>Contato</legend>
          <label for="telefone">Telefone:</label>
          <input type="tel" id="telefone" name="telefone" pattern="[0-9]{10,11}" title="Digite apenas números (10 ou 11 dígitos)" required>
        </fieldset>

        <label>
          <input type="checkbox" name="termos" required>
          Aceito os termos de participação.
        </label>

        <div>
          <button type="submit">Enviar cadastro</button>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Nome da ONG - Todos os direitos reservados.</p>
  </footer>
  <script src="js/menu.js"></script>
</body>
</html>
